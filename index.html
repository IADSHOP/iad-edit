<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8E8E5">
  <meta name="description" content="OFFCUT STUDIO — Digital Video Gallery">
  <meta name="application-name" content="OFFCUT STUDIO">
  <title>OFFCUT STUDIO — Digital Video Gallery</title>
  <link rel="stylesheet" href="style.css?v=offcut-gallery-4">
  <script src="works.js?v=offcut-gallery-4" defer></script>
  <script src="ambient.js?v=offcut-gallery-4" defer></script>
  <script src="script.js?v=offcut-gallery-4" defer></script>
</head>
<body>
  <header class="topbar" aria-label="網站標題"><a class="wordmark" href="index.html" aria-label="OFFCUT STUDIO 首頁"><img src="OFFCUTSTUDIO-transparent.png" alt="OFFCUT STUDIO"></a><div class="topbar-meta"><span class="edition">VIDEO EDITING&nbsp; / &nbsp;2017</span></div></header>
  <main>
    <section class="gallery" aria-label="影片作品輪播" aria-roledescription="carousel">
      <div class="stage" id="stage" aria-label="影片作品展示區">
        <div class="rail" id="rail"></div>
        <div class="empty" id="empty" hidden>將影片加入作品清單，即可開始瀏覽。</div>
      </div>
    </section>
    <footer class="caption">
      <div class="work-info is-home" aria-live="polite"><h1 id="work-title"></h1><span class="work-type" id="work-type"></span><span class="work-badge" id="work-badge" hidden></span></div>
    </footer>
  </main>
  <div class="counter" id="counter" aria-live="polite">HOME</div>
  <nav class="footer-links" aria-label="更多資訊">
    <a href="contact.html">聯繫我們</a>
    <a href="pricing.html">價格方案</a>
  </nav>
  <section class="music-bar" aria-label="背景音樂控制">
    <button class="music-toggle" type="button" data-music-toggle aria-pressed="false" aria-label="播放背景音樂">PLAY</button>
    <div class="music-levels" data-music-levels role="group" aria-label="背景音樂音量等級">
      <button class="music-level-button is-active" type="button" data-music-level="1" aria-label="LEVEL 1，1%" aria-pressed="true">1</button>
      <button class="music-level-button" type="button" data-music-level="2" aria-label="LEVEL 2，2%" aria-pressed="false">2</button>
      <button class="music-level-button" type="button" data-music-level="3" aria-label="LEVEL 3，3%" aria-pressed="false">3</button>
      <button class="music-level-button" type="button" data-music-level="4" aria-label="LEVEL 4，4%" aria-pressed="false">4</button>
      <button class="music-level-button" type="button" data-music-level="5" aria-label="LEVEL 5，5%" aria-pressed="false">5</button>
      <button class="music-level-button" type="button" data-music-level="6" aria-label="LEVEL 6，6%" aria-pressed="false">6</button>
      <button class="music-level-button" type="button" data-music-level="7" aria-label="LEVEL 7，7%" aria-pressed="false">7</button>
      <button class="music-level-button" type="button" data-music-level="8" aria-label="LEVEL 8，8%" aria-pressed="false">8</button>
      <button class="music-level-button" type="button" data-music-level="9" aria-label="LEVEL 9，9%" aria-pressed="false">9</button>
      <button class="music-level-button" type="button" data-music-level="10" aria-label="LEVEL 10，10%" aria-pressed="false">10</button>
    </div>
  </section>
</body>
</html>
