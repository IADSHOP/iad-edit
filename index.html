<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8E8E5">
  <meta name="description" content="OFFCUT STUDIO — Digital Video Gallery">
  <meta name="application-name" content="OFFCUT STUDIO">
  <title>OFFCUT STUDIO — Digital Video Gallery</title>
  <link rel="icon" type="image/png" href="./favicon.png.png">
  <link rel="apple-touch-icon" href="./favicon.png.png">
  <link rel="stylesheet" href="style.css?v=offcut-gallery-6">
  <script src="works.js?v=offcut-gallery-6" defer></script>
  <script src="ambient.js?v=offcut-gallery-6" defer></script>
  <script src="script.js?v=offcut-gallery-6" defer></script>
</head>
<body>
  <header class="topbar" aria-label="網站標題"><a class="wordmark" href="index.html" aria-label="OFFCUT STUDIO 首頁"><img src="OFFCUTSTUDIO-transparent.png" alt="OFFCUT STUDIO"></a><div class="topbar-meta"><span class="edition">VIDEO EDITING&nbsp; / &nbsp;2017</span></div></header>
  <main>
    <section class="gallery" aria-label="影片作品輪播" aria-roledescription="carousel">
      <div class="stage" id="stage" aria-label="影片作品展示區">
        <div class="rail" id="rail"></div>
        <div class="empty" id="empty" hidden>將影片加入作品清單，即可開始瀏覽。</div>
      </div>
    </section>
    <footer class="caption">
      <div class="work-info is-home" aria-live="polite"><h1 id="work-title"></h1><span class="work-type" id="work-type"></span><span class="work-badge" id="work-badge" hidden></span></div>
    </footer>
  </main>
  <div class="counter" id="counter" aria-live="polite">HOME</div>
  <nav class="footer-links" aria-label="更多資訊">
    <a href="contact.html">聯繫我們</a>
    <a href="pricing.html">價格方案</a>
    <a href="order-lookup.html">訂單資訊</a>
  </nav>
  <section class="music-bar" aria-label="背景音樂控制">
    <button class="music-toggle" type="button" data-music-toggle aria-pressed="false" aria-label="播放背景音樂">
      <span class="music-label-default">Background Music</span>
      <span class="music-label-play" aria-hidden="true">PLAY</span>
      <span class="music-label-pause" aria-hidden="true">PAUSE</span>
    </button>
    <div class="music-volume-control">
      <svg class="music-speaker" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M3 8v4h3l4 3V5L6 8H3Z"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7.1 7.1 0 0 1 0 10"/></svg>
      <div class="music-volume-wrap">
        <input id="music-volume" class="music-volume" data-music-volume type="range" min="1" max="5" step="1" value="1" aria-label="背景音樂音量，五段">
        <span class="music-volume-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
  </section>
  <div class="playback-overlay" id="playback-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="影片播放">
    <button class="playback-close" type="button" aria-label="關閉全螢幕影片">×</button>
    <div class="playback-surface" id="playback-surface"></div>
  </div>
</body>
</html>
